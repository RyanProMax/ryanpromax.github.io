<text x="170" y="865" font-family="Noto Sans CJK SC, sans-serif" font-size="26" fill="#718095" font-weight="400">页面主线程可继续处理其他任务，并在检查点执行微任务</text>
<text x="1300" y="861" font-family="Noto Sans CJK SC, sans-serif" font-size="23" fill="#718095" font-weight="400">等待网络响应</text>
