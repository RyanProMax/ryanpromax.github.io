<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1740" viewBox="0 0 1800 1740"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" stroke="#A3B1C1" stroke-width="1.5" fill="none"/></marker></defs><rect width="1800" height="1740" fill="#FAFBFD"/>
<text x="80" y="92" font-family="Noto Sans CJK SC, sans-serif" font-size="46" fill="#142B43" font-weight="700">Chromium 实例：模块协作时序</text>
<text x="82" y="146" font-family="Noto Sans CJK SC, sans-serif" font-size="28" fill="#718095" font-weight="400">时间向下：点击 → fetch 请求 → 回调更新页面</text>
