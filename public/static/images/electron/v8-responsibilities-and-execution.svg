<text x="333" y="1065" font-family="Noto Sans CJK SC, sans-serif" font-size="23" fill="#142B43" font-weight="500">04  处理结果，兑现 Promise</text>
<path d="M711 1140 H309" fill="none" stroke="#718095" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#a)"/>
<text x="333" y="1125" font-family="Noto Sans CJK SC, sans-serif" font-size="23" fill="#718095" font-weight="400">then 回调进入微任务队列</text>
