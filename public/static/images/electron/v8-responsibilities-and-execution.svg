<text x="1382" y="358" font-family="Noto Sans CJK SC, sans-serif" font-size="30" fill="#158E88" font-weight="600">网络服务</text>
<text x="1382" y="398" font-family="Noto Sans CJK SC, sans-serif" font-size="23" fill="#718095" font-weight="400">异步请求 · 接收响应</text>
