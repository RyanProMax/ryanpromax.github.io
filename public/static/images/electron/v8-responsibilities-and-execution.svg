<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1580" viewBox="0 0 1800 1580"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" stroke="#A3B1C1" stroke-width="1.5" fill="none"/></marker></defs><rect width="1800" height="1580" fill="#FAFBFD"/>
<text x="80" y="92" font-family="Noto Sans CJK SC, sans-serif" font-size="48" fill="#142B43" font-weight="700">一次点击，如何经过 V8 更新页面</text>
