<text x="333" y="1190" font-family="Noto Sans CJK SC, sans-serif" font-size="24" fill="#142B43" font-weight="500">05  驱动微任务检查点</text>
<text x="752" y="1249" font-family="Noto Sans CJK SC, sans-serif" font-size="23" fill="#4079CC" font-weight="600">V8 执行 then 回调</text>
