<path d="M309 500 H711" fill="none" stroke="#4079CC" stroke-width="2" marker-end="url(#a)"/>
<text x="333" y="485" font-family="Noto Sans CJK SC, sans-serif" font-size="25" fill="#142B43" font-weight="500">01  派发点击，调用 JS</text>
<path d="M729 570 H1511" fill="none" stroke="#4079CC" stroke-width="2" marker-end="url(#a)"/>
<text x="775" y="555" font-family="Noto Sans CJK SC, sans-serif" font-size="25" fill="#142B43" font-weight="500">02  fetch 经宿主 API 发起请求</text>
<text x="765" y="650" font-family="Noto Sans CJK SC, sans-serif" font-size="24" fill="#4079CC" font-weight="400">fetch 立即返回 Promise</text>
<path d="M711 705 H309" fill="none" stroke="#718095" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#a)"/>
<text x="333" y="690" font-family="Noto Sans CJK SC, sans-serif" font-size="23" fill="#718095" font-weight="400">同步代码执行结束，返回</text>
<text x="1370" y="958" font-family="Noto Sans CJK SC, sans-serif" font-size="23" fill="#158E88" font-weight="600">收到响应</text>
