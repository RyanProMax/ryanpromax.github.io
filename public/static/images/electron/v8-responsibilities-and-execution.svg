<text x="333" y="1395" font-family="Noto Sans CJK SC, sans-serif" font-size="23" fill="#718095" font-weight="400">微任务队列清空，返回</text>
<path d="M309 1500 H1111" fill="none" stroke="#4079CC" stroke-width="2" marker-end="url(#a)"/>
<text x="410" y="1485" font-family="Noto Sans CJK SC, sans-serif" font-size="25" fill="#142B43" font-weight="500">07  遇到渲染机会，执行页面更新</text>
<text x="1150" y="1558" font-family="Noto Sans CJK SC, sans-serif" font-size="22" fill="#158E88" font-weight="400">样式 · 布局 · 绘制准备</text>
<text x="135" y="1631" font-family="Noto Sans CJK SC, sans-serif" font-size="22" fill="#718095" font-weight="400">实线：调用 / 通知     虚线：返回     细长色条：调用处理区间；网络列为请求存续区间</text>
</svg>