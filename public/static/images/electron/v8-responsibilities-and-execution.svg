<text x="982" y="358" font-family="Noto Sans CJK SC, sans-serif" font-size="30" fill="#158E88" font-weight="600">DOM / 渲染</text>
<text x="982" y="398" font-family="Noto Sans CJK SC, sans-serif" font-size="23" fill="#718095" font-weight="400">更新结构 · 样式与布局</text>
