<text x="753" y="1285" font-family="Noto Sans CJK SC, sans-serif" font-size="24" fill="#142B43" font-weight="500">06  调用 DOM API</text>
<path d="M1111 1355 H729" fill="none" stroke="#718095" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#a)"/>
<text x="753" y="1340" font-family="Noto Sans CJK SC, sans-serif" font-size="23" fill="#718095" font-weight="400">DOM 更新完成，返回</text>
